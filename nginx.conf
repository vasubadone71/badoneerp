# NGINX Configuration for Badone ERP Cloud VPS
# Location: /etc/nginx/sites-available/badone-erp

server {
    listen 80;
    # Replace with your actual domain or IP address
    server_name your_domain_or_ip;

    # Serve the React Frontend Build
    root /var/www/badone-erp/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse Proxy for Node.js API & Socket.io
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addressee;
    }

    location /socket.io/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Optimize File Uploads Serving
    location /uploads/ {
        alias /var/www/badone-erp/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Allow larger file uploads (for documents)
    client_max_body_size 50M;
}
